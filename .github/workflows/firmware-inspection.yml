name: Firmware inspection

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag in danielmaude28/twrp-x6531
        required: true
        default: dump1
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and extraction tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y cpio lz4 device-tree-compiler

      - name: Run unit tests
        run: python -m pytest -q

      - name: Download every asset and release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p firmware reports
          gh api "repos/danielmaude28/twrp-x6531/releases/tags/$RELEASE_TAG" > reports/release-metadata.json
          gh release download "$RELEASE_TAG" \
            --repo danielmaude28/twrp-x6531 \
            --dir firmware

      - name: Verify release asset sizes and SHA-256
        run: |
          python scripts/verify_release_assets.py \
            --release-json reports/release-metadata.json \
            --input firmware \
            --output reports/asset-verification.json

      - name: Obtain AOSP boot image inspection utility
        run: |
          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg "$RUNNER_TEMP/mkbootimg"
          test -f "$RUNNER_TEMP/mkbootimg/unpack_bootimg.py"

      - name: Inventory and unpack boot images
        run: |
          python scripts/inspect_firmware.py \
            --input firmware \
            --output reports \
            --unpack-bootimg "$RUNNER_TEMP/mkbootimg/unpack_bootimg.py"

      - name: Inspect DTBO table and inventory modules
        run: |
          python scripts/inspect_dtbo.py --input firmware/dtbo.img --output reports/dtbo-inventory.json
          python scripts/inspect_modules.py --input firmware --output reports/module-inventory.json

      - name: Upload inspection report and source inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x6531b-android14-firmware-inspection
          path: |
            reports/
            firmware/
          if-no-files-found: warn
          retention-days: 14
